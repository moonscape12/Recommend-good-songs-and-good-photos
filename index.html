<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>은하수에 밤하는</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>🌙 은하수에 밤하는</h1>
    <p>사이트 접속 코드를 입력해주세요.</p>
    <input id="accessCode" type="password" placeholder="접속 코드">
    <button id="loginBtn">입장하기</button>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>

<div id="site" class="hidden">
<header>
  <h1>🌙 은하수에 밤하는</h1>
  <nav>
    <button data-page="home">홈</button>
    <button data-page="music">노래 추천</button>
    <button data-page="photos">사진 공유</button>
    <button data-page="about">소개</button>
  </nav>
</header>

<main>
<section id="home" class="page">
  <div class="hero">
    <div>
      <p class="small">MOONLIGHT • NIGHT • MEMORY</p>
      <h2>달빛 아래에서<br>우리의 밤을 기록해요.</h2>
      <p>사진과 글, 좋아하는 노래를 함께 남길 수 있는 작은 밤의 공간입니다.</p>
    </div>
  </div>
</section>

<section id="music" class="page hidden">
  <h2>🎵 노래 추천</h2>
  <p>좋아하는 노래의 이름이나 YouTube 링크를 남겨보세요.</p>
  <div class="card">
    <input id="songTitle" placeholder="노래 제목">
    <input id="songUrl" placeholder="YouTube 링크 (선택)">
    <button id="addSong">추천 올리기</button>
  </div>
  <div id="songList"></div>
</section>

<section id="photos" class="page hidden">
  <h2>📷 사진 + 글</h2>
  <div class="card">
    <input id="photoFile" type="file" accept="image/*">
    <textarea id="photoText" placeholder="사진과 함께 남길 글"></textarea>
    <div id="preview"></div>
    <button id="postPhoto">올리기</button>
  </div>
  <div id="photoList"></div>
</section>

<section id="about" class="page hidden">
  <h2>🌌 소개</h2>
  <div class="card about">
    <img class="about-logo" src="assets/logo.png" alt="달스케이프 로고">
    <h3>은하수에 밤하는</h3>
    <p>밤하늘과 달빛처럼 조용하고 편안한 분위기에서 사진과 글, 음악을 기록하는 공간입니다.</p>
    <p><b>만든 사람: 달스케이프</b></p>
  </div>
  <img class="about-feature" src="assets/about-intro.jpg" alt="달빛 아래 화면 속 풍경을 그리는 개발자 달스케이프">
  <div class="about-gallery">
    <img src="assets/about-closeup.jpg" alt="노트북을 바라보는 달스케이프">
    <img src="assets/about-library.jpg" alt="달밤의 도서관에서 코딩하는 달스케이프">
    <img src="assets/about-moon.png" alt="달빛 아래의 밤하늘">
    <img src="assets/about-library-girl.png" alt="달밤의 도서관 창가에 기대어 있는 모습">
  </div>
</section>
</main>
<footer>© 달스케이프 · 은하수에 밤하는</footer>
</div>
<script src="script.js"></script>
</body>
</html>
